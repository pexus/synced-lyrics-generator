<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Synced Lyrics</title>
    <meta name="csrf-token" content="{{ csrf_token() }}">
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background-color: #f8f9fa;
            margin: 0;
            color: #333;
        }
        .container {
            max-width: 420px;
            margin: 6em auto;
            padding: 2em;
            background: #fff;
            border-radius: 8px;
            box-shadow: 0 2px 15px rgba(0,0,0,0.08);
        }
        h1 {
            margin: 0 0 1em;
            font-size: 1.5em;
        }
        .form-group {
            display: flex;
            flex-direction: column;
            margin-bottom: 1em;
        }
        label {
            margin-bottom: 0.5em;
            font-weight: 600;
        }
        input {
            padding: 0.6em 0.8em;
            border-radius: 6px;
            border: 1px solid #ced4da;
        }
        .btn {
            width: 100%;
            padding: 0.7em;
            border: none;
            border-radius: 6px;
            background: #007bff;
            color: #fff;
            font-size: 1em;
            cursor: pointer;
        }
        .btn:hover {
            background: #0056b3;
        }
        .error {
            background: #f8d7da;
            color: #721c24;
            padding: 0.75em;
            border-radius: 6px;
            margin-bottom: 1em;
        }
        .hint {
            margin-top: 1em;
            font-size: 0.9em;
            color: #6c757d;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Sign in</h1>
        {% if error %}
            <div class="error">{{ error }}</div>
        {% endif %}
        <form method="post" action="{{ url_for('auth.login') }}">
            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
            <div class="form-group">
                <label for="email">Email</label>
                <input type="email" name="email" id="email" required autofocus>
            </div>
            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" name="password" id="password" required>
            </div>
            <div class="form-group">
                <label for="totp">MFA code (if enabled)</label>
                <input type="text" name="totp" id="totp" autocomplete="one-time-code">
            </div>
            <button class="btn" type="submit">Login</button>
        </form>
        <div class="hint">Need access? Ask an admin for an invite.</div>
    </div>
</body>
</html>
