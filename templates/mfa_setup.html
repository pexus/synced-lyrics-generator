<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Set Up MFA</title>
    <meta name="csrf-token" content="{{ csrf_token() }}">
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background-color: #f8f9fa;
            margin: 0;
            color: #333;
        }
        .container {
            max-width: 620px;
            margin: 2em auto;
            padding: 2em;
            background: #fff;
            border-radius: 8px;
            box-shadow: 0 2px 15px rgba(0,0,0,0.08);
        }
        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1.5em;
            gap: 1em;
            flex-wrap: wrap;
        }
        .btn {
            text-decoration: none;
            color: white;
            background-color: #007bff;
            padding: 8px 12px;
            border-radius: 5px;
            border: none;
            cursor: pointer;
            font-size: 0.95em;
        }
        .btn-secondary {
            background-color: #6c757d;
        }
        .qr {
            margin: 1em 0;
            text-align: center;
        }
        .code {
            word-break: break-all;
            background: #f1f3f5;
            padding: 0.5em 0.8em;
            border-radius: 6px;
            font-family: monospace;
        }
        .form-group {
            display: flex;
            flex-direction: column;
            margin-top: 1em;
        }
        input {
            padding: 0.6em 0.8em;
            border-radius: 6px;
            border: 1px solid #ced4da;
        }
        .error {
            background: #f8d7da;
            color: #721c24;
            padding: 0.75em;
            border-radius: 6px;
            margin-bottom: 1em;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="top-bar">
            <div>Set up MFA</div>
            <a href="{{ url_for('auth.account_security') }}" class="btn btn-secondary">Back</a>
        </div>

        {% if error %}
            <div class="error">{{ error }}</div>
        {% endif %}

        <p>Scan this QR code in your authenticator app, then enter the 6-digit code.</p>
        <div class="qr">
            <img src="data:image/png;base64,{{ qr_b64 }}" alt="MFA QR code">
        </div>
        <p>If you cannot scan the code, use this setup key:</p>
        <div class="code">{{ provisioning_uri }}</div>

        <form method="post" action="{{ url_for('auth.mfa_setup') }}">
            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
            <div class="form-group">
                <label for="code">Authentication code</label>
                <input type="text" name="code" id="code" required>
            </div>
            <button class="btn" type="submit">Enable MFA</button>
        </form>
    </div>
</body>
</html>
