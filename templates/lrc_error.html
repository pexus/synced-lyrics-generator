{% extends "debug_base.html" %}
{% block title %}LRC Error for {{ basename }}{% endblock %}
{% block content %}
<div class="container mt-4">
    <h2>LRC Debug Error for: {{ basename }}</h2>
    <div class="card border-danger">
        <div class="card-header bg-danger text-white">
            <h5 class="mb-0">LRC File Not Found</h5>
        </div>
        <div class="card-body">
            <div class="alert alert-danger">
                <p><strong>Error:</strong> The LRC file for "{{ basename }}" does not exist.</p>
                <p>Expected path: <code>{{ lrc_path }}</code></p>
            </div>
            <div class="mt-3">
                <a href="{{ url_for('main.index') }}" class="btn btn-secondary">
                    <i class="fas fa-home"></i> Back to Home
                </a>
            </div>
        </div>
    </div>
</div>
{% endblock %}
